<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Dropdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { padding: 50px; background-color: #212529; color: #fff; }
    </style>
</head>
<body>
    <div class="text-end">
        <div class="dropdown d-inline-block">
            <button class="btn btn-sm btn-link text-danger text-decoration-none px-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-slash"></i> Toggle Dropdown
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="min-width: 220px;">
                <li><h6 class="dropdown-header text-muted">Suspension Options</h6></li>
                <li>
                    <form action="#" method="post">
                        <button type="submit" class="dropdown-item text-warning">
                            <i class="bi bi-clock me-2"></i>Suspend for 1 Day
                        </button>
                    </form>
                </li>
                <li>
                    <form action="#" method="post">
                        <button type="submit" class="dropdown-item text-warning">
                            <i class="bi bi-calendar-event me-2"></i>Suspend for 1 Week
                        </button>
                    </form>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form action="#" method="post">
                        <button type="submit" class="dropdown-item text-danger fw-bold">
                            <i class="bi bi-person-x me-2"></i>Deactivate (Permanent)
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
